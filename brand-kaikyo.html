<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaikyo Distillery - Spirited</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/aesthetic-beauty-cf" rel="stylesheet">
</head>
<body data-page="brand">
    <!-- Preloader -->
    <div id="preloader">
        <div class="preloader-content">
            <div class="preloader-spinner"></div>
            <div class="preloader-text">SPIRITED</div>
        </div>
    </div>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Brand Hero Section -->
    <section class="brand-hero" id="brand-hero">
        <div class="brand-hero-content">
            <h1 class="brand-hero-title" id="brand-hero-title">KAIKYO<br>DISTILLERY</h1>
        </div>
    </section>

    <!-- Brand Content -->
    <main class="brand-main">
        <div class="brand-container" id="brand-container">
            <!-- Content will be loaded from JSON -->
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>
    <script src="js/script.js"></script>
    <script src="js/brand.js"></script>
</body>
</html>
