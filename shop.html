<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit - Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="shop">
    <!-- Preloader -->
    <div id="preloader">
        <div class="preloader-inner">
            <div class="preloader-spinner"></div>
            <p class="preloader-text">SPIRITED</p>
        </div>
    </div>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main>
        <!-- Shop Hero -->
        <section class="shop-hero">
            <div class="shop-hero-overlay"></div>
            <div class="shop-hero-content">
                <h1>SHOP</h1>
            </div>
        </section>

        <!-- Products Section -->
        <section class="hot-summer-section">
            <div class="container">
                <div class="products-layout">
                    <!-- Sidebar - Product Categories -->
                    <aside class="product-sidebar">
                        <h3 class="sidebar-title">PRODUCT<br>CATEGORIES</h3>
                        <div class="category-list">
                            <div class="category-item has-dropdown active open" data-filter="WHISKEY">WHISKEY</div>
                            <div class="category-sub-list show">
                                <div class="category-item sub-item" data-filter="NAGAHAMA">NAGAHAMA</div>
                                <div class="category-item sub-item" data-filter="AMAHAGAN">AMAHAGAN</div>
                                <div class="category-item sub-item" data-filter="SABUROMARU">SABUROMARU</div>
                                <div class="category-item sub-item" data-filter="FAR EAST OF PEAT">FAR EAST OF PEAT</div>
                            </div>
                            <div class="category-item" data-filter="SAKE">SAKE</div>
                            <div class="category-item" data-filter="GIN">GIN</div>
                        </div>
                    </aside>

                    <!-- Main Products Area -->
                    <div class="products-main">
                        <!-- Filter Bar -->
                        <div class="filter-bar">
                            <div class="filter-left">
                                <div class="filter-item">
                                    <label>Availability</label>
                                    <select>
                                        <option>All Products</option>
                                        <option>In Stock</option>
                                        <option>Out of Stock</option>
                                    </select>
                                </div>
                                <div class="filter-item">
                                    <label>Price</label>
                                    <select>
                                        <option>All Prices</option>
                                        <option>Price: Low to High</option>
                                        <option>Price: High to Low</option>
                                    </select>
                                </div>
                            </div>
                            <div class="pagination-controls">
                                <span class="page-info">1/3</span>
                                <button class="pagination-btn prev" disabled><i class="fas fa-chevron-left"></i></button>
                                <button class="pagination-btn next"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>

                        <!-- Products Grid (populated by script.js from data/products.json) -->
                        <div class="products-grid">
                            <div class="products-loading">
                                <div class="loading-spinner"></div>
                                <p>Loading products...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
