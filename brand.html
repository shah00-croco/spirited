<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand - Spirited</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/aesthetic-beauty-cf" rel="stylesheet">
</head>
<body data-page="brand" class="no-scroll">
    <!-- Age Verification Modal -->
    <div id="age-gate-modal" class="age-gate-modal">
        <div class="age-gate-content">
            <div class="age-gate-logo">
                <img src="assets/logo/logo-spirited-blue.svg" alt="Spirited Logo">
            </div>
            <h2 class="age-gate-title">You must be of legal drinking age<br>to enter this site.</h2>
            <div class="age-gate-checkboxes">
                <label class="age-gate-checkbox">
                    <input type="checkbox" id="age-confirm">
                    <span class="checkmark"></span>
                    <span class="checkbox-text">I confirm that I am 21 years old or above and a non-Muslim</span>
                </label>
                <label class="age-gate-checkbox">
                    <input type="checkbox" id="terms-confirm">
                    <span class="checkmark"></span>
                    <span class="checkbox-text">I agree to the Terms & Conditions, Privacy Policy, and Cookie Policy</span>
                </label>
            </div>
            <button id="age-gate-enter" class="age-gate-btn" disabled>ENTER</button>
        </div>
    </div>

    <!-- Preloader -->
    <div id="preloader">
        <div class="preloader-content">
            <div class="preloader-spinner"></div>
            <div class="preloader-text">SPIRITED</div>
        </div>
    </div>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Brand Hero Section -->
    <section class="brand-hero" id="brand-hero">
        <div class="brand-hero-content">
            <h1 class="brand-hero-title" id="brand-hero-title">BRAND</h1>
        </div>
    </section>

    <!-- Brand Content -->
    <main class="brand-main">
        <div class="brand-container" id="brand-container">
            <!-- Content will be loaded from JSON -->
        </div>
        <div class="relate-product" id="brand-products-container">
            <!-- Content will be loaded from JSON -->
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>
    <script src="js/script.js"></script>
    <script src="js/brand.js"></script>
</body>
</html>
